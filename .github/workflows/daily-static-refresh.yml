name: Daily static date refresh

on:
  schedule:
    # 00:20 Asia/Shanghai. Scheduled workflows use UTC.
    - cron: "20 16 * * *"
  workflow_dispatch:

concurrency:
  group: whatdatetime-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_SITE_URL: https://whatdatetime.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source quality
        run: |
          npm run typecheck
          npm run lint

      - name: Build current static HTML and run SEO gates
        run: npm run build

      - name: Deploy the verified static site
        run: npx wrangler deploy workers/sites-entry.js
