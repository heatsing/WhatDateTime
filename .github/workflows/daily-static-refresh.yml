name: Daily SEO verification and manual production release

on:
  schedule:
    # 00:20 Asia/Shanghai. Scheduled workflows use UTC.
    - cron: "20 16 * * *"
  workflow_dispatch:
    inputs:
      refresh_dates:
        description: "Refresh the static date snapshot (rewrites date-dependent HTML)"
        required: false
        default: false
        type: boolean

concurrency:
  group: whatdatetime-verification-and-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-or-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_SITE_URL: https://whatdatetime.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the production source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source quality
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Use a fresh reference time for a manual production release
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_dates
        shell: bash
        run: echo "WHATDATETIME_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_ENV"

      - name: Build current static HTML and run SEO gates
        run: npm run build

      - name: Verify navigation through the local Cloudflare runtime
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8790 --show-interactive-dev-session false > /tmp/whatdatetime-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8790/ > /dev/null; then break; fi
            sleep 2
          done
          npm run test:ssr

      - name: Verify Worker packaging without deploying
        run: npx wrangler deploy --dry-run --outdir workers/generated/dry-run

      - name: Verify Cloudflare deployment credentials
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare secret::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing Cloudflare account ID::Add CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx wrangler whoami

      - name: Deploy the verified assets-first site
        if: github.event_name == 'workflow_dispatch'
        run: npm run deploy
